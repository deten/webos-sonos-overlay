<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 1920px;
  height: 1080px;
  background: transparent;
  overflow: hidden;
  font-family: Arial, 'LG Display', sans-serif;
  pointer-events: none;
}

#overlay {
  position: fixed;
  right: 123px;
  top: 50%;
  transform: translateY(-50%) scale(0.92);
  width: 220px;
  background: rgba(12, 12, 12, 0.88);
  border-radius: 16px;
  padding: 18px 24px 16px;
  color: #fff;
  text-align: center;
  opacity: 0;
  transition: opacity 0.14s ease, transform 0.14s ease;
  pointer-events: none;
}

#overlay.visible {
  opacity: 1;
  transform: translateY(-50%) scale(1);
}

#vol-label {
  font-size: 15px;
  font-weight: 400;
  letter-spacing: 0.18em;
  color: rgba(255,255,255,0.55);
  text-transform: uppercase;
  margin-bottom: 4px;
}

#vol-number {
  font-size: 90px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 14px;
  letter-spacing: -2px;
}

#vol-number.muted {
  font-size: 44px;
  letter-spacing: 0.05em;
}

#bar-track {
  width: 100%;
  height: 4px;
  background: rgba(255,255,255,0.18);
  border-radius: 2px;
  overflow: hidden;
}

#bar-fill {
  height: 100%;
  background: #fff;
  border-radius: 2px;
  transition: width 0.12s ease;
}
</style>
</head>
<body>
<div id="overlay">
  <div id="vol-label">Volume</div>
  <div id="vol-number">—</div>
  <div id="bar-track"><div id="bar-fill" style="width:0%"></div></div>
</div>

<script>
var overlay    = document.getElementById('overlay');
var volNum     = document.getElementById('vol-number');
var barFill    = document.getElementById('bar-fill');
var hideTimer  = null;
var closeTimer = null;
var HIDE_MS    = 1750;

function showVolume(vol, muted) {
  clearTimeout(hideTimer);
  clearTimeout(closeTimer);

  if (muted) {
    volNum.textContent  = 'MUTED';
    volNum.className    = 'muted';
    barFill.style.width = '0%';
  } else {
    volNum.textContent  = vol;
    volNum.className    = '';
    barFill.style.width = Math.min(100, Math.max(0, vol)) + '%';
  }
  overlay.classList.add('visible');

  hideTimer = setTimeout(function() {
    overlay.classList.remove('visible');
    closeTimer = setTimeout(function() {
      if (window.PalmSystem) window.PalmSystem.hide();
      window.close();
    }, 150);
  }, HIDE_MS);
}

function fetchAndShow() {
  fetch('http://localhost:7476/api/status')
    .then(function(r) { return r.json(); })
    .then(function(s) {
      showVolume(
        s.lastVol   !== null ? s.lastVol   : 0,
        s.lastMuted !== null ? s.lastMuted : false
      );
    })
    .catch(function() { window.close(); });
}

if (window.PalmSystem) window.PalmSystem.stageReady();

document.addEventListener('webOSRelaunch', fetchAndShow);

fetchAndShow();
</script>
</body>
</html>
